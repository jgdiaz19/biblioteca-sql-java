# Levantamos una instancia independiente para ejecutar las pruebas.
services:
  postgres_test:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: biblioteca_local
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - biblioteca_test_pgdata:/var/lib/postgresql/data
      - ./database:/scripts:ro
      - ./database/inicializar.sh:/docker-entrypoint-initdb.d/01-inicializar.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d biblioteca_operativa"]
      interval: 2s
      timeout: 3s
      retries: 40
volumes:
  biblioteca_test_pgdata:
